name: Tests

# The unit suite, run as its own workflow so it can be the required check on
# main.
#
# NO `paths` FILTER, DELIBERATELY. A required check has to report on every pull
# request: one that is skipped never reports at all, and GitHub waits for it
# forever rather than treating it as passed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The version the image ships (Dockerfile FROM), so the suite runs on
          # what actually runs.
          python-version: '3.12'

      - name: Install the package and its test dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q
